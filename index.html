<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuMovil - Buscar Destino</title>
    
    <!-- Estilos de Leaflet (OpenStreetMap) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
        }
        h2 {
            color: #333;
            font-size: 1.2rem;
            text-align: center;
        }
        #buscador-container {
            margin-bottom: 15px;
        }
        #direccion-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        #map {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h2>TuMovil - Selector de Destino</h2>

    <div id="buscador-container">
        <!-- Input donde el usuario escribe la dirección -->
        <input id="direccion-input" type="text" placeholder="Escribe el destino (ej. Moreno centro)..." />
    </div>

    <!-- Contenedor del Mapa OpenStreetMap -->
    <div id="map"></div>

    <!-- 1. Cargar Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 2. Cargar la API de Google Places (Reemplaza 'TU_API_KEY' por tu clave de Google Cloud) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY&libraries=places"></script>

    <script>
        // Inicializar el mapa de OpenStreetMap centrado en Moreno (por defecto)
        var map = L.map('map').setView([-34.6545, -58.7905], 13); // Coordenadas aproximadas de Moreno

        // Añadir la capa visual de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var marker = null;

        // Configurar el Autocompletado de Google en el input
        function initAutocomplete() {
            const input = document.getElementById('direccion-input');
            const autocomplete = new google.maps.places.Autocomplete(input);

            // Restringir un poco la búsqueda a Argentina o zona cercana si querés (opcional)
            autocomplete.setComponentRestrictions({ 'country': ['arg'] });

            // Evento que se dispara cuando el usuario SELECCIONA una dirección de la lista
            autocomplete.addListener('place_changed', function() {
                const place = autocomplete.getPlace();

                if (!place.geometry || !place.geometry.location) {
                    alert("No se encontró información para esta ubicación.");
                    return;
                }

                // Obtener latitud y longitud automáticamente de Google
                const lat = place.geometry.location.lat();
                const lng = place.geometry.location.lng();

                // Mover el mapa de OpenStreetMap a esas coordenadas automáticamente
                map.setView([lat, lng], 16);

                // Si ya había un marcador anterior, lo borramos
                if (marker) {
                    map.removeLayer(marker);
                }

                // Ponemos el nuevo pin en el mapa de OpenStreetMap
                marker = L.marker([lat, lng]).addTo(map)
                    .bindPopup(`<b>Destino:</b> ${place.name}`)
                    .openPopup();
                
                console.log("Coordenadas seleccionadas -> Lat:", lat, "Lng:", lng);
            });
        }

        // Ejecutar la función de inicio cuando cargue la página
        window.onload = initAutocomplete;
    </script>

</body>
</html>
