<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuMovil - Panel Pasajero</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #map { height: 350px; width: 100%; }
        .chat-container { height: 250px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-10">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold">TuMovil - Pasajero</h1>
        <span id="estado-conexion" class="text-xs bg-amber-500 px-2 py-1 rounded-full font-medium">Conectando...</span>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Sección de Solicitud de Viaje -->
        <section id="panel-solicitud" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h2 class="font-bold text-lg mb-3 text-slate-700">¿A dónde vamos?</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Origen</label>
                    <input type="text" id="origen-input" value="Mi ubicación actual" class="w-full p-2 border rounded-lg text-sm bg-slate-100" readonly>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Destino</label>
                    <input type="text" id="destino-input" placeholder="Ej. Terminal de Ómnibus" class="w-full p-2 border rounded-lg text-sm">
                </div>
                <button onclick="solicitarViaje()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg shadow transition">
                    Solicitar Viaje
                </button>
            </div>
        </section>

        <!-- Estado del Viaje (Oculto inicialmente) -->
        <section id="panel-viaje" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-lg text-slate-700">Estado del Viaje</h2>
                <span id="badge-estado" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-bold">Buscando conductor...</span>
            </div>
            
            <div id="info-conductor" class="hidden mb-3 p-3 bg-slate-50 rounded-lg border border-slate-100 text-sm">
                <p class="font-bold text-slate-700">Conductor Asignado: <span id="nombre-conductor" class="font-normal">Juan Pérez</span></p>
                <p class="text-slate-500 text-xs">Vehículo: <span id="vehiculo-conductor">Chevrolet Corsa (ABC-123)</span></p>
            </div>

            <!-- Mapa -->
            <div class="rounded-xl overflow-hidden shadow-inner border border-slate-200 mb-4">
                <div id="map"></div>
            </div>

            <!-- CHAT EN TIEMPO REAL CON EL CONDUCTOR -->
            <div class="border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
                <div class="bg-slate-100 p-2.5 border-b border-slate-200 flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-600 uppercase tracking-wider">Chat con Conductor</span>
                    <span id="chat-status" class="w-2 h-2 rounded-full bg-emerald-500" title="Conectado"></span>
                </div>
                <!-- Mensajes -->
                <div id="chat-mensajes" class="chat-container p-3 overflow-y-auto space-y-2 bg-slate-50 text-sm flex flex-col">
                    <div class="text-center text-xs text-slate-400 my-auto">El chat se activará al asignar conductor.</div>
                </div>
                <!-- Input -->
                <div class="p-2 bg-white border-t border-slate-200 flex gap-2">
                    <input type="text" id="chat-input" placeholder="Escribe un mensaje..." class="flex-1 p-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" disabled>
                    <button onclick="enviarMensajeChat()" id="btn-enviar-chat" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition disabled:opacity-50" disabled>
                        Enviar
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Configuración de Supabase (Reemplaza con tus credenciales)
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map, markerPasajero, markerConductor;
        let viajeId = 'viaje_test_123'; // ID de ejemplo o dinámico
        let pasajeroId = 'pasajero_abc';
        let chatCanal = null;

        // Inicializar Mapa
        function initMap() {
            map = L.map('map').setView([-34.6037, -58.3816], 14); // Coordenadas iniciales de ejemplo
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
            }).addTo(map);

            markerPasajero = L.marker([-34.6037, -58.3816]).addTo(map).bindPopup('Tu ubicación').openPopup();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            probarConexionSupabase();
        });

        async function probarConexionSupabase() {
            const badge = document.getElementById('estado-conexion');
            try {
                const { data, error } = await supabaseClient.from('viajes').select('id').limit(1);
                if (error && error.code !== 'PGRST116') throw error;
                badge.textContent = 'En línea';
                badge.className = 'text-xs bg-emerald-500 text-white px-2 py-1 rounded-full font-medium';
            } catch (err) {
                console.error(err);
                badge.textContent = 'Modo Local / Error DB';
                badge.className = 'text-xs bg-red-500 text-white px-2 py-1 rounded-full font-medium';
            }
        }

        function solicitarViaje() {
            const destino = document.getElementById('destino-input').value;
            if(!destino) {
                alert('Por favor ingresa un destino');
                return;
            }

            document.getElementById('panel-solicitud').classList.add('hidden');
            document.getElementById('panel-viaje').classList.remove('hidden');
            
            // Habilitar chat y canales
            inicializarChatPasajero();
        }

        function inicializarChatPasajero() {
            const contenedorMensajes = document.getElementById('chat-mensajes');
            contenedorMensajes.innerHTML = ''; // Limpiar mensaje de espera

            document.getElementById('chat-input').removeAttribute('disabled');
            document.getElementById('btn-enviar-chat').removeAttribute('disabled');

            // Nos suscribimos al canal de Supabase para este viaje específico
            if (chatCanal) supabaseClient.removeChannel(chatCanal);

            chatCanal = supabaseClient.channel(`viaje_${viajeId}`)
                .on('broadcast', { event: 'nuevo_mensaje' }, payload => {
                    const mensaje = payload.payload;
                    // Solo pintamos si el mensaje viene del conductor
                    if (mensaje.remitente !== pasajeroId) {
                        agregarMensajeUI(mensaje.texto, 'conductor');
                    }
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('Pasajero conectado al canal de chat del viaje.');
                    }
                });
        }

        async function enviarMensajeChat() {
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            if (!texto) return;

            const mensajeObj = {
                remitente: pasajeroId,
                texto: texto,
                timestamp: new Date().toISOString()
            };

            // Mostrar localmente en la interfaz del pasajero
            agregarMensajeUI(texto, 'pasajero');
            input.value = '';

            // Enviar a través del canal Broadcast de Supabase
            if (chatCanal) {
                await chatCanal.send({
                    type: 'broadcast',
                    event: 'nuevo_mensaje',
                    payload: mensajeObj
                });
            }
        }

        function agregarMensajeUI(texto, tipo) {
            const contenedor = document.getElementById('chat-mensajes');
            const div = document.createElement('div');
            
            if (tipo === 'pasajero') {
                div.className = 'ml-auto bg-blue-600 text-white p-2 rounded-lg max-w-[80%] text-xs shadow-sm';
            } else {
                div.className = 'mr-auto bg-white border border-slate-200 text-slate-700 p-2 rounded-lg max-w-[80%] text-xs shadow-sm';
            }
            div.textContent = texto;
            contenedor.appendChild(div);
            contenedor.scrollTop = contenedor.scrollHeight;
        }
    </script>
</body>
</html>
