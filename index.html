<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tu Móvil - Pasajero</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #11121a; height: 100vh; overflow: hidden; color: #ffffff;
        }

        #mapaContainer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; z-index: 1; }
        #mapaLeaflet { width: 100%; height: 100%; }

        /* PANTALLA DE CARGA */
        #pantallaCarga {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f172a;
            z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 45px; height: 45px; border: 4px solid #334155; border-top: 4px solid #38bdf8;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* PANEL SUPERIOR */
        .header-float { position: fixed; top: 16px; left: 16px; right: 16px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .passenger-badge { background: #1e293b; color: #38bdf8; padding: 10px 16px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #334155; pointer-events: auto; display: flex; align-items: center; gap: 8px; }

        /* PANEL INFERIOR DE SOLICITUD */
        .bottom-panel {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000; background: #1e293b;
            border-radius: 24px 24px 0 0; border-top: 1px solid #334155; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            padding: 16px 20px 28px; color: #f1f5f9; transition: transform 0.3s ease;
        }
        .panel-handle { width: 40px; height: 5px; background: #475569; border-radius: 3px; margin: 0 auto 14px; }

        .section-title { font-size: 1rem; font-weight: 800; color: #38bdf8; margin-bottom: 12px; }

        /* SELECTOR DE TIPO DE VEHÍCULO (AUTO / MOTO) */
        .vehicle-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .vehicle-option {
            background: #0f172a; border: 2px solid #334155; border-radius: 14px; padding: 12px;
            text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .vehicle-option.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .vehicle-option span { font-size: 0.85rem; font-weight: 700; color: #f1f5f9; }
        .vehicle-option small { font-size: 0.7rem; color: #94a3b8; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
        .form-input {
            width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 12px;
            border-radius: 12px; font-size: 0.95rem; outline: none;
        }
        .form-input:focus { border-color: #38bdf8; }

        .btn-pedir {
            width: 100%; background: #10b981; color: white; border: none; padding: 14px;
            border-radius: 14px; font-weight: 800; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); transition: background 0.2s;
        }
        .btn-pedir:hover { background: #059669; }

        /* Marcadores en mapa */
        .custom-marker-icon {
            background: #1e293b; border: 2px solid #38bdf8; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); overflow: hidden;
        }
        .custom-marker-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA SEGURA -->
    <div id="pantallaCarga">
        <div style="background: #1e293b; padding: 16px; border-radius: 20px; border: 1px solid #334155; text-align: center; max-width: 280px;">
            <h3 style="color: #38bdf8; font-size: 1.1rem; margin-bottom: 6px;">TU MÓVIL</h3>
            <p style="font-size: 0.8rem; color: #94a3b8;" id="textoCarga">Conectando con el sistema...</p>
            <div class="spinner"></div>
            <button onclick="forzarEntrada()" style="margin-top: 15px; background: #334155; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.75rem; cursor: pointer;">Saltar si tarda</button>
        </div>
    </div>

    <div id="mapaContainer"><div id="mapaLeaflet"></div></div>

    <div class="header-float">
        <div class="passenger-badge">📍 Tu Móvil - Pasajero</div>
    </div>

    <!-- PANEL INFERIOR DE SOLICITUD CON SELECTOR AUTO / MOTO -->
    <div class="bottom-panel" id="panelSolicitud">
        <div class="panel-handle"></div>
        <div class="section-title">¿A dónde vamos hoy?</div>

        <!-- SELECTOR DE VEHÍCULO -->
        <div class="vehicle-selector">
            <div class="vehicle-option selected" id="optAuto" onclick="seleccionarVehiculo('auto')">
                <span style="font-size: 1.2rem;">🚗</span>
                <span>Auto</span>
                <small>Estándar / Confort</small>
            </div>
            <div class="vehicle-option" id="optMoto" onclick="seleccionarVehiculo('moto')">
                <span style="font-size: 1.2rem;">🏍️</span>
                <span>Moto</span>
                <small>Rápido / Económico</small>
            </div>
        </div>

        <div class="form-group">
            <label>Destino o Dirección</label>
            <input type="text" id="txtDestino" class="form-input" placeholder="Ej: Estación San Miguel, Av. Mitre...">
        </div>

        <button class="btn-pedir" onclick="solicitarViaje()">Pedir Viaje Ahora 🚀</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://hinqiuvbwygqhbabvxrc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpbnFpdXZid3lncWhiYWJ2eHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODIyMzIsImV4cCI6MjA5NTA1ODIzMn0.wdnO33BVRtJ9-va3iqiAdWCttkAzpL5K1-b4vtyDvJA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ESTACION_SAN_MIGUEL = [-34.54291, -58.71212];
        let mapa = null;
        let tipoVehiculoSeleccionado = 'auto'; // Por defecto auto
        let marcadoresChoferes = {};

        function seleccionarVehiculo(tipo) {
            tipoVehiculoSeleccionado = tipo;
            document.getElementById('optAuto').classList.remove('selected');
            document.getElementById('optMoto').classList.remove('selected');
            
            if (tipo === 'auto') {
                document.getElementById('optAuto').classList.add('selected');
            } else {
                document.getElementById('optMoto').classList.add('selected');
            }
        }

        function forzarEntrada() {
            const carga = document.getElementById('pantallaCarga');
            carga.style.opacity = '0';
            setTimeout(() => carga.classList.add('hidden'), 400);
        }

        function initMapa() {
            try {
                mapa = L.map('mapaLeaflet', { zoomControl: false, attributionControl: false }).setView(ESTACION_SAN_MIGUEL, 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
                
                cargarConductoresEnMapa();
            } catch (e) {
                console.error("Error al inicializar mapa:", e);
            } finally {
                // Quitar pantalla de carga tras inicializar
                setTimeout(forzarEntrada, 600);
            }
        }

        async function cargarConductoresEnMapa() {
            try {
                const { data: choferes, error } = await supabaseClient.from('conductores').select('*');
                if (error) throw error;

                if (!choferes) return;

                choferes.forEach(c => {
                    let lat = c.lat || c.latitud;
                    let lng = c.lng || c.longitud || c.lon;
                    let identificador = c.patente || c.id || c.nombre;

                    if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
                        let fotoChofer = c.selfie_url || c.foto || 'https://images2.imgbox.com/39/3a/V39LpB1X_o.jpg';
                        
                        let iconoChoferHTML = L.divIcon({
                            className: 'custom-marker-icon',
                            html: `<img src="${fotoChofer}" alt="Móvil">`,
                            iconSize: [38, 38],
                            iconAnchor: [19, 19]
                        });

                        if (marcadoresChoferes[identificador]) {
                            marcadoresChoferes[identificador].setLatLng([lat, lng]);
                        } else {
                            let marker = L.marker([lat, lng], { icon: iconoChoferHTML }).addTo(mapa);
                            marker.bindPopup(`<b>🚗 ${c.nombre}</b><br>Vehículo: ${c.tipo_vehiculo || 'Auto'}`);
                            marcadoresChoferes[identificador] = marker;
                        }
                    }
                });
            } catch (e) {
                console.error("Error al cargar choferes:", e);
            }
        }

        async function solicitarViaje() {
            const destino = document.getElementById('txtDestino').value.trim();
            if (!destino) {
                alert("Por favor, ingresa una dirección de destino.");
                return;
            }

            try {
                const datosViaje = {
                    pasajero_nombre: 'Pasajero App',
                    destino: destino,
                    tipo_vehiculo: tipoVehiculoSeleccionado,
                    estado: 'pendiente',
                    precio: tipoVehiculoSeleccionado === 'moto' ? 1200 : 2000 // Precio orientativo según tipo
                };

                const { error } = await supabaseClient.from('viajes').insert([datosViaje]);
                if (error) throw error;

                alert(`¡Viaje en ${tipoVehiculoSeleccionado.toUpperCase()} solicitado con éxito! Buscando conductor cercano...`);
                document.getElementById('txtDestino').value = '';
            } catch (e) {
                alert("Error al solicitar el viaje: " + e.message);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMapa();
            setInterval(cargarConductoresEnMapa, 5000);
        });
    </script>
</body>
</html>
