<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1b12">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TuMóvil - Conductor</title>

    <link rel="manifest" href="/manifest-conductor.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="/js/conductor-styles.css">
</head>
<body onclick="forzarHabilitacionAudio()">

    <div id="modalConfigChofer" class="hidden">
        <div class="config-card">
            <h2>🚗 Registro de Conductor</h2>
            <p>Ingresá tus datos y tu selfie para que los pasajeros te reconozcan.</p>
            <form id="formConfigChofer" onsubmit="guardarConfigChofer(event)">
                <div style="text-align: center; margin-bottom: 12px;">
                    <img id="imgPreview" class="preview-selfie" src="https://images2.imgbox.com/39/3a/V39LpB1X_o.jpg" alt="Foto Perfil">
                    <label style="font-size: 0.75rem; color: #4ade80; cursor: pointer; text-decoration: underline; display: inline-block; padding: 6px 12px; background: #08120d; border: 1px solid #166534; border-radius: 8px;">
                        Tomar Selfie con Cámara 📷
                        <input type="file" id="inpFotoFile" accept="image/*" capture="user" style="display: none;" onchange="procesarYComprimirFoto(event)">
                    </label>
                </div>
                <div class="config-field">
                    <label>Nombre y Apellido</label>
                    <input type="text" id="inpNombre" placeholder="Ej: Juan Pérez" required>
                </div>
                <div class="config-field">
                    <label>Número de WhatsApp</label>
                    <input type="tel" id="inpTelefono" placeholder="Ej: 1123456789" required>
                </div>
                <div class="config-field">
                    <label>Marca y Modelo del Auto</label>
                    <input type="text" id="inpModelo" placeholder="Ej: Fiat Cronos" required>
                </div>
                <div class="config-field">
                    <label>Color del Auto</label>
                    <input type="text" id="inpColor" placeholder="Ej: Blanco" required>
                </div>
                <div class="config-field">
                    <label>Patente / Dominio</label>
                    <input type="text" id="inpPatente" placeholder="Ej: AB123CD" required>
                </div>
                <button type="submit" class="btn-action btn-aceptar" style="margin-top: 10px;" id="btnGuardarRegistro">Guardar y Empezar ✅</button>
            </form>
        </div>
    </div>

    <div id="mapaContainer"><div id="mapaLeaflet"></div></div>

    <div id="modalChatFlotante">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #166534; padding-bottom: 6px;">
            <span style="font-size: 0.82rem; font-weight: 700; color: #4ade80;">💬 Chat con el Pasajero</span>
            <button onclick="toggleChatFlotante()" style="background: #ef4444; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-weight: bold; cursor: pointer; font-size: 0.75rem;">✕</button>
        </div>
        <div class="chat-mensajes-lista" id="listaMensajesChat">
            <div style="color: #86efac; text-align: center; font-size: 0.75rem;">Chat del viaje iniciado...</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="inpMensajeChat" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') enviarMensajeChat()">
            <button onclick="enviarMensajeChat()">Enviar</button>
        </div>
    </div>

    <div class="header-float">
        <div class="header-left-col">
            <div class="status-badge activo" id="txtEstadoChofer" onclick="conmutarEstadoConexion()">Móvil en Línea 🟢</div>
            
            <div class="ganancias-scroll-container">
                <div class="burbuja-stat">
                    <span class="burbuja-label">Total del Día</span>
                    <span class="burbuja-valor verde" id="lblTotalDia">$0</span>
                </div>
                <div class="burbuja-stat">
                    <span class="burbuja-label">Último Viaje</span>
                    <span class="burbuja-valor" id="lblUltimoViaje">$0</span>
                </div>
                <div class="burbuja-stat">
                    <span class="burbuja-label">Viajes Realizados</span>
                    <span class="burbuja-valor" id="lblCantViajes">0</span>
                </div>
            </div>

            <button class="test-audio-btn" id="btnTestSonido" onclick="probarCampanaManual(event)">🔊 Probar Timbre</button>
        </div>

        <div class="header-right-col">
            <button id="btnAbrirChatFlotante" onclick="toggleChatFlotante()">💬</button>
            <button class="google-maps-btn" id="btnAbrirGoogleMaps" onclick="abrirNavegacionGoogleMaps()">🗺️</button>
            <button class="gps-btn" id="btnGpsCentro" onclick="alternarSeguimientoManual()">🎯</button>
        </div>
    </div>

    <div class="bottom-panel" id="panelConductor">
        <div class="panel-handle"></div>
        <div class="msg" id="msgChofer"></div>

        <div id="vistaEspera">
            <div style="text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; padding-top: 2px;">
                <div class="btn-action btn-espera" id="btnEstadoEsperaTexto">
                    <div class="ruedita-radar"></div>
                    Buscando solicitudes (5 km)...
                </div>
            </div>
        </div>

        <div id="vistaViaje" class="hidden">
            <div id="contenedorViajeEntrante"></div>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="/js/conductor-app.js"></script>
</body>
</html>
