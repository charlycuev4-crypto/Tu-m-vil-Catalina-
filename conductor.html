<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tu Móvil - Conductor</title>

    <!-- Supabase & Leaflet -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f4f6; height: 100vh; overflow: hidden; color: #1a1a1a;
        }

        #mapaContainer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; z-index: 1; }
        #mapaLeaflet { width: 100%; height: 100%; }

        /* PANEL INFERIOR DINÁMICO */
        .bottom-panel { 
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; 
            background: #E8E2D5; 
            border-radius: 28px 28px 0 0; 
            box-shadow: 0 -8px 25px rgba(0,0,0,0.2); 
            padding: 12px 16px 20px; 
            max-height: 85vh;
            overflow-y: auto; 
            border-top: 2px solid #2cd44a; 
        }

        .panel-handle { width: 38px; height: 4px; background: #b5ac9b; border-radius: 2px; margin: 0 auto 10px; }

        .driver-card { 
            background: #F4EFE6; padding: 12px; border-radius: 14px; border: 1px solid #2cd44a; 
            box-shadow: 0 4px 12px rgba(44, 212, 74, 0.15); margin-bottom: 10px;
        }

        .badge-trayecto {
            display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; 
            font-weight: 700; margin-bottom: 8px;
        }
        .badge-ida { background: #dcfce7; color: #166534; border: 1px solid #2cd44a; }
        .badge-ida-vuelta { background: #dbeafe; color: #1e40af; border: 1px solid #3b82f6; }

        .btn-action { 
            width: 100%; background: #2cd44a; color: white; border: none; padding: 12px; 
            border-radius: 50px; font-size: 0.95rem; font-weight: 700; cursor: pointer; 
            box-shadow: 0 3px 10px rgba(44,212,74,0.3); text-align: center; margin-top: 6px; 
        }
        .btn-danger { background: #ef4444; box-shadow: 0 3px 10px rgba(239,68,68,0.3); }

        .hidden { display: none !important; }
        .msg { padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 0.8rem; text-align: center; font-weight: 600; }
        .msg-error { background: #fee2e2; color: #991b1b; }
        .msg-success { background: #f0fdf4; color: #166534; }
    </style>
</head>
<body>

    <div id="mapaContainer"><div id="mapaLeaflet"></div></div>

    <div class="bottom-panel" id="bottomPanel">
        <div class="panel-handle"></div>
        <div class="msg hidden" id="msg"></div>

        <!-- ESTADO: ESPERANDO VIAJES -->
        <div id="panelBuscando" style="text-align: center; padding: 15px 0;">
            <div style="font-size: 2rem; margin-bottom: 8px;">📡</div>
            <h3 style="font-size: 1rem; margin-bottom: 4px;">Radar de Viajes Activo</h3>
            <p style="font-size: 0.8rem; color: #555;">Esperando solicitudes de pasajeros cercanos...</p>
        </div>

        <!-- ESTADO: VIAJE ENTRANTE / ASIGNADO -->
        <div id="panelViaje" class="hidden">
            <div class="driver-card">
                <div id="badgeTrayectoContainer" class="badge-trayecto badge-ida">📍 Solo Ida</div>
                <h3 id="nombrePasajero" style="font-size: 0.95rem; font-weight: 700; margin-bottom: 4px;">Pasajero</h3>
                <p id="detallesRuta" style="font-size: 0.8rem; color: #444; margin-bottom: 6px;">Calculando ruta...</p>
                <div style="font-size: 1rem; font-weight: 700; color: #166534; margin-bottom: 8px;" id="precioViajeTxt">$0</div>
                
                <div id="botonesAccionContainer">
                    <button class="btn-action" id="btnAceptarViaje" onclick="aceptarViaje()">Aceptar Viaje</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hinqiuvbwygqhbabvxrc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpbnFpdXZid3lncWhiYWJ2eHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODIyMzIsImV4cCI6MjA5NTA1ODIzMn0.wdnO33BVRtJ9-va3iqiAdWCttkAzpL5K1-b4vtyDvJA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let mapa = null, viajeActual = null, subViaje = null;
        let markerPasajero = null, markerDestino = null, rutaTrazada = null;
        let conductorNombre = "Conductor Tu Móvil", conductorAuto = "Vehículo Estándar";

        function initMapa() {
            mapa = L.map('mapaLeaflet', { zoomControl: false, attributionControl: false }).setView([-34.54291, -58.71212], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        }

        async function escucharViajesPendientes() {
            supabaseClient
                .channel('conductor-radar')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'viajes' }, payload => {
                    if (payload.new.estado === 'pendiente' && !viajeActual) {
                        cargarViajeEntrante(payload.new);
                    }
                })
                .subscribe();

            // Buscar si ya hay uno activo guardado
            const viajeIdGuardado = localStorage.getItem('conductor_viaje_id');
            if (viajeIdGuardado) {
                const { data } = await supabaseClient.from('viajes').select('*').eq('id', viajeIdGuardado).single();
                if (data && data.estado !== 'finalizado' && data.estado !== 'cancelado') {
                    cargarViajeEntrante(data);
                }
            }
        }

        function cargarViajeEntrante(viaje) {
            viajeActual = viaje;
            localStorage.setItem('conductor_viaje_id', viaje.id);

            document.getElementById('panelBuscando').classList.add('hidden');
            document.getElementById('panelViaje').classList.remove('hidden');

            document.getElementById('nombrePasajero').textContent = viaje.pasajero_nombre || "Pasajero";
            document.getElementById('precioViajeTxt').textContent = 'Tarifa: $' + viaje.precio;

            // Manejo del tipo de trayecto
            const badgeContainer = document.getElementById('badgeTrayectoContainer');
            const esIdaYVuelta = (viaje.tipo_trayecto === 'ida_vuelta' || viaje.tipo_trayecto === 'Ida y Vuelta');
            
            if (esIdaYVuelta) {
                badgeContainer.className = 'badge-trayecto badge-ida-vuelta';
                badgeContainer.textContent = '🔄 Viaje de Ida y Vuelta';
            } else {
                badgeContainer.className = 'badge-trayecto badge-ida';
                badgeContainer.textContent = '📍 Viaje de Solo Ida';
            }

            // Dibujar marcadores
            if (markerPasajero) mapa.removeLayer(markerPasajero);
            if (markerDestino) mapa.removeLayer(markerDestino);

            markerPasajero = L.marker([viaje.origen_lat, viaje.origen_lng]).addTo(mapa).bindPopup("Origen del Pasajero").openPopup();
            markerDestino = L.marker([viaje.destino_lat, viaje.destino_lng]).addTo(mapa).bindPopup("Destino");

            mapa.setView([viaje.origen_lat, viaje.origen_lng], 15);
            actualizarBotonesEstado();
        }

        async function aceptarViaje() {
            if (!viajeActual) return;
            try {
                const { error } = await supabaseClient.from('viajes').update({
                    estado: 'aceptado',
                    conductor_nombre: conductorNombre,
                    conductor_auto: conductorAuto
                }).eq('id', viajeActual.id);

                if (error) throw error;
                viajeActual.estado = 'aceptado';
                actualizarBotonesEstado();
                mostrarMsg('¡Viaje aceptado con éxito!', 'success');
            } catch (e) {
                mostrarMsg('Error al aceptar: ' + e.message, 'error');
            }
        }

        function actualizarBotonesEstado() {
            const container = document.getElementById('botonesAccionContainer');
            if (viajeActual.estado === 'pendiente') {
                container.innerHTML = `<button class="btn-action" onclick="aceptarViaje()">Aceptar Viaje</button>`;
            } else if (viajeActual.estado === 'aceptado') {
                container.innerHTML = `<button class="btn-action" onclick="marcarLlegada()">Llegué al Origen</button>`;
            } else if (viajeActual.estado === 'en_viaje') {
                container.innerHTML = `<button class="btn-action btn-danger" onclick="finalizarViaje()">Finalizar Viaje</button>`;
            }
        }

        async function marcarLlegada() {
            await supabaseClient.from('viajes').update({ estado: 'en_viaje' }).eq('id', viajeActual.id);
            viajeActual.estado = 'en_viaje';
            actualizarBotonesEstado();
            mostrarMsg('En camino al destino...', 'success');
        }

        async function finalizarViaje() {
            await supabaseClient.from('viajes').update({ estado: 'finalizado' }).eq('id', viajeActual.id);
            localStorage.removeItem('conductor_viaje_id');
            location.reload();
        }

        function mostrarMsg(texto, tipo) { 
            const msg = document.getElementById('msg'); 
            msg.textContent = texto; 
            msg.className = 'msg msg-' + tipo; 
            setTimeout(() => msg.classList.add('hidden'), 4000); 
        }

        window.addEventListener('DOMContentLoaded', () => { 
            initMapa(); 
            escucharViajesPendientes(); 
        });
    </script>
</body>
</html>
