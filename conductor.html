<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuMovil - Panel de Conductor</title>
    <!-- Supabase Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
        }
        .status-box {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }
        .status-online { background-color: #d4edda; color: #155724; }
        .status-offline { background-color: #f8d7da; color: #721c24; }
        .trip-card {
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Panel de Conductor</h2>
        <div id="estadoConexion" class="status-box status-offline">Estado: Conectando...</div>
        
        <div id="contenedorViajes">
            <p>Esperando nuevos viajes en tiempo real...</p>
        </div>
    </div>

    <script>
        // Configuración de Supabase (Reemplaza con tus credenciales reales)
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
        
        // Inicializar cliente de Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Variables globales de control
        let wakeLock = null;
        let canalSupabase = null;
        let reconectando = false;

        const divEstado = document.getElementById('estadoConexion');
        const divViajes = document.getElementById('contenedorViajes');

        // 1. Gestión del Wake Lock para evitar suspensión de pantalla/procesos
        async function solicitarWakeLock() {
            if ('wakeLock' in navigator && document.visibilityState === 'visible') {
                try {
                    if (wakeLock) {
                        await wakeLock.release();
                        wakeLock = null;
                    }
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock activo: Manteniendo dispositivo despierto.');
                    
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock liberado por el sistema.');
                        wakeLock = null;
                    });
                } catch (err) {
                    console.error(`Error al solicitar Wake Lock: ${err.name}, ${err.message}`);
                }
            }
        }

        // 2. Procesar la llegada de un nuevo viaje
        function manejarNuevoViaje(viaje) {
            divViajes.innerHTML = `
                <div class="trip-card">
                    <h3>¡Nuevo Viaje Asignado!</h3>
                    <p><strong>Origen:</strong> ${viaje.origen || 'No especificado'}</p>
                    <p><strong>Destino:</strong> ${viaje.destino || 'No especificado'}</p>
                    <p><strong>Tarifa:</strong> $${viaje.tarifa || '0.00'}</p>
                </div>
            `;
            
            // Opcional: Vibrar el celular si el navegador lo soporta para alertar al conductor
            if ('vibrate' in navigator) {
                navigator.vibrate([200, 100, 200]);
            }
        }

        // 3. Inicialización o reconexión segura de Supabase Realtime
        function iniciarEscuchaViajes() {
            if (canalSupabase) {
                supabaseClient.removeChannel(canalSupabase);
                canalSupabase = null;
            }

            console.log('Estableciendo conexión con Supabase Realtime...');
            
            canalSupabase = supabaseClient.channel('cambios-viajes-conductor')
                .on(
                    'postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'viajes' },
                    (payload) => {
                        console.log('¡Nuevo viaje detectado!', payload.new);
                        manejarNuevoViaje(payload.new);
                    }
                )
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('Canal de Supabase conectado exitosamente.');
                        divEstado.textContent = 'Estado: Conectado (Escuchando viajes)';
                        divEstado.className = 'status-box status-online';
                        reconectando = false;
                    } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
                        console.warn('Conexión con Supabase perdida. Reconectando...');
                        divEstado.textContent = 'Estado: Reconectando...';
                        divEstado.className = 'status-box status-offline';
                        manejarReconexionSupabase();
                    }
                });
        }

        // 4. Mecanismo de reintento ante fallos de red
        function manejarReconexionSupabase() {
            if (reconectando) return;
            reconectando = true;
            
            setTimeout(() => {
                iniciarEscuchaViajes();
            }, 4000);
        }

        // 5. Consulta de respaldo por si se perdió algún evento en segundo plano
        async function buscarViajesPendientesRecientes() {
            try {
                const { data, error } = await supabaseClient
                    .from('viajes')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (!error && data && data.length > 0) {
                    // Aquí puedes validar si el viaje es reciente y mostrarlo si aplica
                    console.log('Datos recientes consultados por seguridad:', data[0]);
                }
            } catch (err) {
                console.error('Error al consultar viajes de respaldo:', err);
            }
        }

        // 6. Control de visibilidad del navegador (Primer plano / Segundo plano)
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                console.log('App nuevamente en primer plano.');
                await solicitarWakeLock();
                
                if (!canalSupabase || canalSupabase.state === 'closed' || canalSupabase.state === 'errored') {
                    iniciarEscuchaViajes();
                }

                buscarViajesPendientesRecientes();
            } else {
                console.log('App en segundo plano.');
                solicitarWakeLock();
            }
        });

        // 7. Arranque inicial al cargar la ventana
        window.addEventListener('load', async () => {
            await solicitarWakeLock();
            iniciarEscuchaViajes();
        });
    </script>
</body>
</html>
