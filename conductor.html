<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuMovil - Panel de Control Familiar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b131b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Simulación del Mapa de Fondo */
        .map-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e293b;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* Elementos flotantes superiores */
        .top-status {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .earnings-container {
            position: absolute;
            top: 70px;
            left: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .earning-card {
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .earning-card span {
            font-size: 10px;
            color: #94a3b8;
            display: block;
            text-transform: uppercase;
        }

        .earning-card strong {
            font-size: 14px;
            color: #34d399;
        }

        /* NUEVA UBICACIÓN: Botón flotante de chat reubicado arriba del panel inferior derecho */
        .chat-float-btn {
            position: absolute;
            bottom: 240px; /* Justo arriba del panel de viaje inferior */
            right: 20px;
            width: 55px;
            height: 55px;
            background: #38bdf8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 20;
            cursor: pointer;
            border: 2px solid #ffffff;
            transition: transform 0.2s;
        }

        .chat-float-btn:active {
            transform: scale(0.95);
        }

        .chat-float-btn svg {
            width: 26px;
            height: 26px;
            fill: #0f172a;
        }

        /* Contenedor del Chat (Ventana emergente) */
        .chat-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 27, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
        }

        .chat-overlay.active {
            display: flex;
        }

        .chat-box {
            background: #1e293b;
            width: 100%;
            border-radius: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            max-height: 80vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            font-size: 16px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-chat {
            background: #ef4444;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .chat-body {
            padding: 15px;
            height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: #94a3b8;
            font-size: 13px;
        }

        .chat-footer {
            padding: 12px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }

        .chat-footer input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .chat-footer button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Panel Inferior del Conductor (Menú del pasajero) */
        .bottom-panel {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: #1e293b;
            border-radius: 20px;
            padding: 18px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .passenger-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .passenger-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .passenger-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            overflow: hidden;
            border: 2px solid #38bdf8;
        }

        .passenger-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .passenger-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }

        .trip-price {
            font-size: 18px;
            font-weight: bold;
            color: #34d399;
        }

        .trip-route {
            background: #0f172a;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Simulación del Mapa -->
    <div class="map-background"></div>

    <!-- Estado Superior -->
    <div class="top-status">
        🚗 Yendo al Pasajero
    </div>

    <!-- Panel de Ganancias -->
    <div class="earnings-container">
        <div class="earning-card">
            <span>Total del día</span>
            <strong>$42.120</strong>
        </div>
        <div class="earning-card">
            <span>Último</span>
            <strong>$4.400</strong>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE DEL CHAT (Reubicado en la parte inferior derecha) -->
    <div class="chat-float-btn" onclick="toggleChat()">
        <svg viewBox="0 0 24 24">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
    </div>

    <!-- VENTANA DEL CHAT CON EL PASAJERO (Pantalla Completa / Expandida) -->
    <div class="chat-overlay" id="chatOverlay">
        <div class="chat-box">
            <div class="chat-header">
                <h3>💬 Chat con el Pasajero</h3>
                <!-- Botón X para cerrar y volver al tablero principal -->
                <button class="close-chat" onclick="toggleChat()">✕</button>
            </div>
            <div class="chat-body">
                <p>No hay mensajes previos. Escribe algo...</p>
            </div>
            <div class="chat-footer">
                <input type="text" placeholder="Escribe un mensaje...">
                <button>Enviar</button>
            </div>
        </div>
    </div>

    <!-- PANEL INFERIOR DEL CONDUCTOR -->
    <div class="bottom-panel">
        <div class="passenger-info">
            <div class="passenger-details">
                <div class="passenger-avatar">
                    <span style="font-size: 12px; color: #fff;">GH</span>
                </div>
                <div class="passenger-name">Gerlo hoty</div>
            </div>
            <div class="trip-price">$5720</div>
        </div>

        <div class="trip-route">
            <div>📍 <strong>Recogida:</strong> Trujui (Solano López)</div>
            <div>🏁 <strong>Destino:</strong> Trujui (Avenida Bernardo Caveri)</div>
            <div>⏱️ 1 min de viaje real (0.0 km)</div>
        </div>

        <button class="action-btn">Ya llegué a la puerta 🔓</button>
    </div>

    <script>
        function toggleChat() {
            const overlay = document.getElementById('chatOverlay');
            overlay.classList.toggle('active');
        }
    </script>
</body>
</html>
