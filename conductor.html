<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Conductor - Viajes en Tiempo Real</title>
    <!-- Leaflet CSS para Mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; height: 100vh; }
        header { background: #111; color: #fff; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        #map { flex: 1; width: 100%; min-height: 300px; }
        
        /* Panel de Alertas y Solicitudes flotante */
        #panel-control {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
            padding: 20px;
            z-index: 1000;
            max-height: 50vh;
            overflow-y: auto;
        }

        .estado-box {
            text-align: center;
            padding: 15px;
            font-size: 1rem;
            color: #666;
        }

        /* Tarjeta de Viaje Entrante */
        .card-viaje {
            background: #fff;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .card-viaje h3 { margin-bottom: 8px; color: #007bff; font-size: 1.1rem; }
        .card-viaje p { font-size: 0.95rem; margin-bottom: 5px; color: #444; }

        /* Botones de Acción */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-aceptar { background: #28a745; color: white; }
        .btn-aceptar:hover { background: #218838; }
        
        .btn-rechazar { background: #dc3545; color: white; }
        .btn-rechazar:hover { background: #c82333; }

        /* Alerta flotante de conflictos (Race Condition) */
        #alerta-conflicto {
            display: none;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>Panel Conductor - En Línea 🟢</header>

    <!-- Mapa interactivo Leaflet -->
    <div id="map"></div>

    <!-- Panel inferior de control de solicitudes -->
    <div id="panel-control">
        <div id="alerta-conflicto">⚠️ ¡Ups! Este viaje ya fue tomado por otro colega. Buscando nuevos pedidos...</div>
        
        <div id="contenedor-estado" class="estado-box">
            <p>Esperando solicitudes de viaje cercanas...</p>
        </div>
    </div>

    <!-- Librería Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase Client JS (Asegurate de incluir tu script de conexión si usas ES modules o CDN global) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Configuración inicial del Mapa (Centrado por defecto)
        const mapa = L.map('map').setView([-34.6037, -58.3816], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(mapa);

        let marcadorVehiculo = null;

        // Simulación de conexión a Supabase (Reemplazar con tus credenciales reales)
        // const supabaseUrl = 'TU_SUPABASE_URL';
        // const supabaseKey = 'TU_SUPABASE_ANON_KEY';
        // const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const contenedorEstado = document.getElementById('contenedor-estado');
        const alertaConflicto = document.getElementById('alerta-conflicto');

        // Función para mostrar alerta visual temporal de conflicto (Race Condition)
        function mostrarAvisoConflicto() {
            alertaConflicto.style.display = 'block';
            setTimeout(() => {
                alertaConflicto.style.display = 'none';
            }, 4000);
        }

        // Simulación de llegada de una solicitud de viaje
        function simularLlegadaViaje() {
            contenedorEstado.innerHTML = `
                <div class="card-viaje" id="tarjeta-solicitud">
                    <h3>🚗 Nueva Solicitud de Viaje</h3>
                    <p><strong>Pasajero:</strong> Juan Pérez</p>
                    <p><strong>Origen:</strong> Av. San Martín 1200</p>
                    <p><strong>Destino:</strong> Terminal Central</p>
                    <p><strong>Tarifa estimada:</strong> $4,500 (Recargo Nocturno Incluido)</p>
                    <button class="btn btn-aceptar" onclick="aceptarViaje('VIAJE_ID_123')">Aceptar Viaje</button>
                    <button class="btn btn-rechazar" onclick="rechazarSolicitud()">Rechazar / Omitir</button>
                </div>
            `;
        }

        // Lógica al hacer clic en "Aceptar" con control inteligente de concurrencia
        async function aceptarViaje(viajeId) {
            try {
                // EJEMPLO DE TRANSACCIÓN / VERIFICACIÓN EN SUPABASE:
                // 1. Consultamos el estado actual del viaje antes de asignarlo
                // const { data: viajeActual, error: errConsulta } = await supabase
                //     .from('viajes')
                //     .in('estado', ['buscando', 'pendiente']) // Validamos que siga libre
                //     .eq('id', viajeId)
                //     .single();

                // if (errConsulta || !viajeActual) {
                //     throw new Error("El viaje ya no está disponible.");
                // }

                // 2. Intentamos actualizar el estado asignando nuestro ID de conductor
                // const { error: errUpdate } = await supabase
                //     .from('viajes')
                //     .update({ estado: 'asignado', conductor_id: 'MI_ID_DE_CONDUCTOR' })
                //     .eq('id', viajeId)
                //     .eq('estado', 'buscando'); // Doble reaseguro atómico

                // if (errUpdate) throw new Error("Conflicto de asignación");

                // SIMULACIÓN DE ÉXITO O CONFLICTO PARA PRUEBA LOCAL:
                let simulacionOtroColegaLoTomo = false; // Cambiar a true para probar el aviso

                if (simulacionOtroColegaLoTomo) {
                    throw new Error("Conflicto de competencia");
                }

                // FLUJO EXITOSO:
                contenedorEstado.innerHTML = `
                    <div class="card-viaje" style="border-color: #28a745;">
                        <h3 style="color: #28a745;">✅ ¡Viaje Asignado con Éxito!</h3>
                        <p>Dirígete al punto de recogida del pasajero.</p>
                        <button class="btn btn-rechazar" onclick="cancelarViajeEnCurso()">Cancelar / Liberar Viaje</button>
                    </div>
                `;

                // ZOOM AL 30% MÁS DE DETALLE (Zoom nivel 17 al iniciar/aceptar trayecto)
                // Obtenemos ubicación GPS actual y aplicamos el zoom solicitado
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        mapa.setView([lat, lng], 17); // Nivel 17 de zoom detallado
                        
                        if (!marcadorVehiculo) {
                            marcadorVehiculo = L.marker([lat, lng]).addTo(mapa).bindPopup("Tu ubicación actual").openPopup();
                        } else {
                            marcadorVehiculo.setLatLng([lat, lng]);
                        }
                    });
                }

            } catch (error) {
                // MANEJO DE LA "RACE CONDITION" (Llegó un segundo tarde)
                mostrarAvisoConflicto();
                
                // Limpiamos la tarjeta y dejamos la pantalla lista y libre para el próximo pedido
                setTimeout(() => {
                    contenedorEstado.innerHTML = `<p>Esperando nuevas solicitudes de viaje cercanas...</p>`;
                }, 1000);
            }
        }

        function rechazarSolicitud() {
            contenedorEstado.innerHTML = `<p>Solicitud rechazada. Esperando nuevas solicitudes...</p>`;
            setTimeout(() => {
                contenedorEstado.innerHTML = `<p>Esperando solicitudes de viaje cercanas...</p>`;
            }, 2000);
        }

        function cancelarViajeEnCurso() {
            if(confirm("¿Estás seguro de cancelar este viaje asignado?")) {
                contenedorEstado.innerHTML = `<p>Viaje cancelado. Buscando nuevos pedidos...</p>`;
                setTimeout(() => {
                    contenedorEstado.innerHTML = `<p>Esperando solicitudes de viaje cercanas...</p>`;
                }, 2000);
            }
        }

        // Llamada de prueba para simular que entra un viaje al cabo de 3 segundos
        setTimeout(simularLlegadaViaje, 3000);
    </script>
</body>
</html>
