<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuMovil - Panel de Administrador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f1f5f9; padding: 16px; }
        h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 16px; text-align: center; }

        /* Estilos de Tarjetas de Usuario */
        .admin-card-usuario {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .admin-card-usuario:active { background: #334155; }

        .admin-avatar-box {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            overflow: hidden;
            background: #0f172a;
            border: 2px solid #38bdf8;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .admin-info-box { flex-grow: 1; }
        .admin-nombre { font-size: 1rem; font-weight: 700; color: #fff; }
        .admin-detalles { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }

        /* Modal de Ficha Única de Usuario */
        #modalFichaUnica {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
        }
        .hidden { display: none !important; }
        .ficha-contenido {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            width: 100%; max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            color: #f1f5f9;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        .ficha-header-perfil {
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
            margin-bottom: 16px;
        }
        .ficha-avatar-grande {
            width: 90px; height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin: 0 auto 10px;
            display: block;
            background: #0f172a;
        }
        .stats-financieras-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-caja {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 10px;
            text-align: center;
        }
        .stat-caja-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
        .stat-caja-valor { font-size: 1.1rem; font-weight: 800; color: #10b981; margin-top: 4px; }

        .historial-viajes-lista {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item-historial-viaje {
            background: #0f172a;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #3b82f6;
        }

        /* Módulo de Tarifas */
        .config-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px;
            margin-top: 20px;
        }
        .config-field { margin-bottom: 12px; }
        .config-field label {
            display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; font-weight: 600;
        }
        .config-field input {
            width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; color: #fff; font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <h1>Panel de Administración - TuMovil</h1>

    <!-- SECCIÓN: LISTADO DE CONDUCTORES / USUARIOS -->
    <div style="font-size: 0.9rem; font-weight: 700; color: #94a3b8; margin-bottom: 8px;">CONDUCTORES REGISTRADOS</div>
    <div id="contenedorConductores">
        <!-- Ejemplo de tarjeta interactiva (Se puede generar dinámicamente con JS) -->
        <div class="admin-card-usuario" onclick="abrirFichaUnica({nombre: 'Carlos Cueva', modelo: 'Auto Fiat', patente: 'Jcp 478', foto: ''})">
            <div class="admin-avatar-box">
                <img src="https://via.placeholder.com/150/0f172a/38bdf8?text=Carlos" alt="Foto">
            </div>
            <div class="admin-info-box">
                <div class="admin-nombre">Carlos Cueva</div>
                <div class="admin-detalles">🚗 Auto | Patente: Jcp 478</div>
            </div>
        </div>
    </div>

    <!-- MÓDULO DE CONFIGURACIÓN DE TARIFAS -->
    <div class="config-card">
        <h3 style="color: #38bdf8; font-size: 1.1rem; margin-bottom: 4px;">⚙️ Gestión de Tarifas</h3>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 14px;">Modificá los valores que usarán los pasajeros al calcular viajes.</p>
        
        <div class="config-field">
            <label>Tarifa Base / Bajada de Bandera ($)</label>
            <input type="number" id="inpTarifaBase" placeholder="Ej: 500">
        </div>
        
        <div class="config-field">
            <label>Valor por Kilómetro ($)</label>
            <input type="number" id="inpTarifaKm" placeholder="Ej: 300">
        </div>

        <button style="width: 100%; background: #0284c7; color: #fff; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer;" onclick="guardarNuevasTarifas(event)">Guardar Nuevas Tarifas 💾</button>
    </div>

    <!-- MODAL DE FICHA ÚNICA (Oculto por defecto) -->
    <div id="modalFichaUnica" class="hidden">
        <div class="ficha-contenido">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="color: #38bdf8; font-size: 1.1rem;">📄 Ficha Integral de Usuario</h3>
                <button onclick="cerrarFichaUnica()" style="background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer;">✕</button>
            </div>

            <div class="ficha-header-perfil">
                <img id="fichaFoto" class="ficha-avatar-grande" src="" alt="Foto Perfil">
                <h2 id="fichaNombre" style="font-size: 1.2rem; font-weight: 700;">-</h2>
                <p id="fichaVehiculoPatente" style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">-</p>
            </div>

            <!-- Resumen de Dinero (Día y Semana) -->
            <div class="stats-financieras-grid">
                <div class="stat-caja">
                    <div class="stat-caja-label">Total Día</div>
                    <div class="stat-caja-valor" id="fichaTotalDia">$0</div>
                </div>
                <div class="stat-caja">
                    <div class="stat-caja-label">Total Semana</div>
                    <div class="stat-caja-valor" id="fichaTotalSemana">$0</div>
                </div>
            </div>

            <!-- Historial de Viajes -->
            <div style="font-size: 0.8rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px;">Historial de Servicios</div>
            <div class="historial-viajes-lista" id="fichaHistorialLista">
                <div style="text-align: center; color: #64748b; padding: 15px;">Cargando historial...</div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE FUNCIONAMIENTO -->
    <script>
        // --- GESTIÓN DE TARIFAS ---
        function guardarNuevasTarifas(e) {
            e.preventDefault();
            const tarifaBase = document.getElementById('inpTarifaBase').value;
            const tarifaKm = document.getElementById('inpTarifaKm').value;

            if (!tarifaBase || !tarifaKm) {
                alert("Por favor completá ambos campos de tarifas.");
                return;
            }

            localStorage.setItem('tuMovil_tarifa_base', tarifaBase);
            localStorage.setItem('tuMovil_tarifa_km', tarifaKm);

            alert("¡Tarifas actualizadas correctamente en el sistema!");
        }

        window.addEventListener('DOMContentLoaded', () => {
            if(document.getElementById('inpTarifaBase')) {
                document.getElementById('inpTarifaBase').value = localStorage.getItem('tuMovil_tarifa_base') || '';
                document.getElementById('inpTarifaKm').value = localStorage.getItem('tuMovil_tarifa_km') || '';
            }
        });

        // --- FICHA ÚNICA DE USUARIO ---
        function abrirFichaUnica(usuario) {
            document.getElementById('fichaNombre').innerText = usuario.nombre || 'Sin Nombre';
            document.getElementById('fichaVehiculoPatente').innerText = usuario.patente ? `🚗 ${usuario.modelo || 'Vehículo'} | Patente: ${usuario.patente}` : 'Pasajero TuMovil';
            
            const fotoElem = document.getElementById('fichaFoto');
            fotoElem.src = usuario.foto && usuario.foto.trim() !== '' ? usuario.foto : 'https://via.placeholder.com/150/0f172a/38bdf8?text=Sin+Foto';

            // Datos financieros simulados o conectados a base de datos
            document.getElementById('fichaTotalDia').innerText = "$18.500"; 
            document.getElementById('fichaTotalSemana').innerText = "$94.200";

            // Historial de ejemplo
            const listaHistorial = document.getElementById('fichaHistorialLista');
            listaHistorial.innerHTML = `
                <div class="item-historial-viaje">
                    <span>San Miguel ➔ Bella Vista</span>
                    <strong style="color: #10b981;">+$4.500</strong>
                </div>
                <div class="item-historial-viaje">
                    <span>Muñóz ➔ Centro</span>
                    <strong style="color: #10b981;">+$3.200</strong>
                </div>
            `;

            document.getElementById('modalFichaUnica').classList.remove('hidden');
        }

        function cerrarFichaUnica() {
            document.getElementById('modalFichaUnica').classList.add('hidden');
        }
    </script>
</body>
</html>
