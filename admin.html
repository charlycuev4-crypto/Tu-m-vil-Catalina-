<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuMovil - Panel con GPS y Mapa Interactivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <!-- Leaflet CSS para el Mapa Interactivo -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
        .container { max-width: 650px; margin: 10px auto; background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 15px; font-size: 1.4rem; }
        
        /* Menú Superior de Navegación */
        .nav-menu { display: flex; gap: 4px; margin-bottom: 20px; background: #0f172a; padding: 6px; border-radius: 10px; border: 1px solid #334155; overflow-x: auto; }
        .nav-btn { flex: 1; background: transparent; border: none; color: #94a3b8; padding: 10px 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; border-radius: 6px; text-align: center; white-space: nowrap; }
        .nav-btn.active { background: #38bdf8; color: #0f172a; }
        
        /* Secciones */
        .seccion { display: none; }
        .seccion.active { display: block; }

        .grid-vehiculos { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .grid-vehiculos { grid-template-columns: 1fr; } }
        .card { background: #0f172a; padding: 14px; border-radius: 12px; border: 1px solid #475569; }
        .card h3 { margin-top: 0; padding-bottom: 6px; border-bottom: 2px solid; font-size: 1rem; }
        .card-auto h3 { color: #60a5fa; border-color: #3b82f6; }
        .card-moto h3 { color: #facc15; border-color: #eab308; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 3px; font-size: 0.8rem; color: #94a3b8; }
        input { width: 100%; padding: 8px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: white; box-sizing: border-box; font-size: 0.9rem; }
        
        .btn-guardar { width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-guardar:hover { background: #059669; }
        
        .msg { padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; display: none; font-size: 0.85rem; }
        .success { background: #065f46; color: #34d399; display: block; }
        .error { background: #7f1d1d; color: #fca5a5; display: block; }
        
        /* Perfiles Foto Carnet */
        .grid-perfiles { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .grid-perfiles { grid-template-columns: 1fr; } }
        .perfil-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 15px; text-align: center; }
        .foto-carnet { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid #38bdf8; background: #334155; margin: 0 auto 10px auto; display: block; }
        .perfil-nombre { font-size: 0.95rem; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .perfil-detalle { font-size: 0.8rem; color: #94a3b8; }

        /* Historial de Viajes */
        .viaje-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 12px; border-left: 5px solid #10b981; }
        .viaje-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .viaje-body { font-size: 0.85rem; color: #cbd5e1; line-height: 1.5; }
        .viaje-body span { color: #38bdf8; font-weight: 500; }

        /* Mapa GPS en Vivo */
        #mapaGPS { width: 100%; height: 320px; border-radius: 12px; border: 1px solid #475569; margin-top: 10px; z-index: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎛️ Panel de Control TuMóvil</h2>
        <div id="statusMsg" class="msg"></div>
        
        <!-- Menú de Navegación Superior -->
        <div class="nav-menu">
            <button class="nav-btn active" onclick="cambiarPestana('flota', event)">🚗 Flota</button>
            <button class="nav-btn" onclick="cambiarPestana('perfiles', event)">🛡️ Perfiles</button>
            <button class="nav-btn" onclick="cambiarPestana('viajes', event)">📋 Viajes</button>
            <button class="nav-btn" onclick="cambiarPestana('gps', event); setTimeout(invalidarMapa, 200);">📍 Mapa GPS</button>
        </div>

        <!-- PESTAÑA 1: FLOTA Y TARIFAS -->
        <div id="seccion-flota" class="seccion active">
            <div class="grid-vehiculos">
                <div class="card card-auto">
                    <h3>🚗 AUTO</h3>
                    <div class="form-group"><label>Chofer:</label><input type="text" id="autoChofer"></div>
                    <div class="form-group"><label>Modelo:</label><input type="text" id="autoModelo"></div>
                    <div class="form-group"><label>Patente:</label><input type="text" id="autoPatente"></div>
                    <div class="form-group"><label>Tarifa Base ($):</label><input type="number" id="autoBase"></div>
                    <div class="form-group"><label>Precio x Km ($):</label><input type="number" id="autoKm"></div>
                </div>
                <div class="card card-moto">
                    <h3>🏍️ MOTO</h3>
                    <div class="form-group"><label>Chofer:</label><input type="text" id="motoChofer"></div>
                    <div class="form-group"><label>Modelo:</label><input type="text" id="motoModelo"></div>
                    <div class="form-group"><label>Patente:</label><input type="text" id="motoPatente"></div>
                    <div class="form-group"><label>Tarifa Base ($):</label><input type="number" id="motoBase"></div>
                    <div class="form-group"><label>Precio x Km ($):</label><input type="number" id="motoKm"></div>
                </div>
            </div>
            <button class="btn-guardar" onclick="guardarConfiguracionSupabase()">Guardar Cambios en Supabase</button>
        </div>

        <!-- PESTAÑA 2: PERFILES CON FOTO CARNET -->
        <div id="seccion-perfiles" class="seccion">
            <h3 style="color: #38bdf8; font-size: 1.1rem; margin-top: 0;">🛡️ Perfiles y Fotos Registradas</h3>
            <div id="listaPerfiles" class="grid-perfiles">Cargando perfiles...</div>
        </div>

        <!-- PESTAÑA 3: HISTORIAL DE VIAJES -->
        <div id="seccion-viajes" class="seccion">
            <h3 style="color: #38bdf8; font-size: 1.1rem; margin-top: 0;">📋 Historial Detallado de Viajes</h3>
            <div id="listaHistorialViajes">Cargando historial...</div>
        </div>

        <!-- PESTAÑA 4: GPS EN VIVO (MAPA INTERACTIVO) -->
        <div id="seccion-gps" class="seccion">
            <h3 style="color: #38bdf8; font-size: 1.1rem; margin-top: 0;">📍 Monitoreo GPS en Tiempo Real</h3>
            <p style="font-size: 0.82rem; color: #94a3b8; margin-bottom: 5px;">Ubicación de unidades activas en la zona:</p>
            <div id="mapaGPS"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hinqiuvbwygqhbabvxrc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpbnFpdXZid3lncWhiYWJ2eHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODIyMzIsImV4cCI6MjA5NTA1ODIzMn0.wdnO33BVRtJ9-va3iqiAdWCttkAzpL5K1-b4vtyDvJA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map = null;
        let markerAuto = null;
        let markerMoto = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await cargarConfiguracion();
            await cargarDatosCompletos();
            inicializarMapa();
        });

        function cambiarPestana(idSeccion, evento) {
            document.querySelectorAll('.seccion').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('seccion-' + idSeccion).classList.add('active');
            evento.currentTarget.classList.add('active');
        }

        function invalidarMapa() {
            if (map) {
                map.invalidateSize();
            }
        }

        function inicializarMapa() {
            if (map) return;
            // Coordenadas iniciales (Trujui / Moreno por defecto)
            map = L.map('mapaGPS').setView([-34.582, -58.712], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Marcadores iniciales simulados o reales
            markerAuto = L.marker([-34.582, -58.712]).addTo(map).bindPopup("<b>Auto Asignado</b><br>En línea");
            markerMoto = L.marker([-34.588, -58.705]).addTo(map).bindPopup("<b>Moto Asignada</b><br>En línea");
        }

        async function cargarConfiguracion() {
            try {
                const { data } = await supabaseClient.from('configuracion_tarifas').select('*').eq('activa', true).single();
                if (data) {
                    document.getElementById('autoChofer').value = data.auto_chofer || '';
                    document.getElementById('autoModelo').value = data.auto_modelo || '';
                    document.getElementById('autoPatente').value = data.auto_patente || '';
                    document.getElementById('autoBase').value = data.tarifa_base || 3000;
                    document.getElementById('autoKm').value = data.tarifa_km || 600;
                    
                    document.getElementById('motoChofer').value = data.moto_chofer || '';
                    document.getElementById('motoModelo').value = data.moto_modelo || '';
                    document.getElementById('motoPatente').value = data.moto_patente || '';
                    document.getElementById('motoBase').value = data.moto_base || 1500;
                    document.getElementById('motoKm').value = data.moto_km || 350;
                }
            } catch (e) { console.error(e); }
        }

        async function cargarDatosCompletos() {
            const contenedorPerfiles = document.getElementById('listaPerfiles');
            const contenedorHistorial = document.getElementById('listaHistorialViajes');
            
            try {
                const { data: viajes, error } = await supabaseClient.from('viajes').select('*').order('created_at', { ascending: false }).limit(20);
                if (error) throw error;

                if (!viajes || viajes.length === 0) {
                    contenedorPerfiles.innerHTML = '<p style="color: #94a3b8; grid-column: span 2; text-align: center;">No hay perfiles registrados.</p>';
                    contenedorHistorial.innerHTML = '<p style="color: #94a3b8; text-align: center;">No hay viajes registrados.</p>';
                    return;
                }

                // Renderizar Perfiles
                let htmlPerfiles = '';
                let perfilesVistos = new Set();
                viajes.forEach(v => {
                    if (v.pasajero_foto_url && !perfilesVistos.has(v.pasajero_foto_url)) {
                        perfilesVistos.add(v.pasajero_foto_url);
                        htmlPerfiles += `
                            <div class="perfil-card">
                                <img src="${v.pasajero_foto_url}" class="foto-carnet" alt="Foto Carnet">
                                <div class="perfil-nombre">Pasajero ID: ${v.id}</div>
                                <div class="perfil-detalle" style="color: #38bdf8; font-weight: bold; font-size: 0.75rem; margin-top: 4px;">VERIFICADO</div>
                            </div>`;
                    }
                });
                contenedorPerfiles.innerHTML = htmlPerfiles || '<p style="color: #94a3b8; grid-column: span 2; text-align: center;">Sin fotos recientes.</p>';

                // Renderizar Historial
                let htmlViajes = '';
                viajes.forEach(v => {
                    const fechaSalida = new Date(v.created_at).toLocaleString();
                    htmlViajes += `
                        <div class="viaje-card">
                            <div class="viaje-header">
                                <span><strong>Estado:</strong> <span style="color: #34d399;">${v.estado || 'Finalizado'}</span></span>
                                <span style="font-size: 1rem; font-weight: bold; color: #38bdf8;">$${v.precio || 0}</span>
                            </div>
                            <div class="viaje-body">
                                📍 <strong>Desde:</strong> <span>${v.origen || 'Zona Residencial'}</span><br>
                                🏁 <strong>Hasta:</strong> <span>${v.destino || 'Cruce Castellar'}</span><br>
                                🚗 <strong>Chofer:</strong> <span>${v.chofer_asignado || 'Unidad Activa'}</span><br>
                                ⏱️ <strong>Registro:</strong> <span>${fechaSalida}</span>
                            </div>
                        </div>`;
                });
                contenedorHistorial.innerHTML = htmlViajes;

            } catch (err) {
                console.error(err);
            }
        }

        async function guardarConfiguracionSupabase() {
            const msg = document.getElementById('statusMsg');
            const datosActualizados = {
                auto_chofer: document.getElementById('autoChofer').value.trim(),
                auto_modelo: document.getElementById('autoModelo').value.trim(),
                auto_patente: document.getElementById('autoPatente').value.trim(),
                tarifa_base: Number(document.getElementById('autoBase').value),
                tarifa_km: Number(document.getElementById('autoKm').value),

                moto_chofer: document.getElementById('motoChofer').value.trim(),
                moto_modelo: document.getElementById('motoModelo').value.trim(),
                moto_patente: document.getElementById('motoPatente').value.trim(),
                moto_base: Number(document.getElementById('motoBase').value),
                moto_km: Number(document.getElementById('motoKm').value),
                actualizado_at: new Date()
            };

            try {
                const { error } = await supabaseClient.from('configuracion_tarifas').update(datosActualizados).eq('activa', true);
                if (error) throw error;
                msg.textContent = "¡Configuración guardada exitosamente!";
                msg.className = "msg success";
            } catch (err) {
                msg.textContent = "Error al guardar: " + err.message;
                msg.className = "msg error";
            }
            setTimeout(() => msg.className = "msg", 4000);
        }
    </script>
</body>
</html>
